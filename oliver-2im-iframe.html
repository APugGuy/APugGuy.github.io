<!doctype html>
<html lang="no">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Oliver 2IM vurdering</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="iframe-page">
  <div class="top-container top-container--with-back">
    <div class="top-back">
      <button type="button" class="back-button" id="backBtn">Tilbake</button>
    </div>
    <div class="top-box fw-semibold">Oliver 2IM vurdering</div>
  </div>

  <main class="iframe-shell">
    <section class="mb-4">
      <h1 class="h3 fw-bold mb-2">Innebygd forhåndsvisning</h1>
      <p class="lead">Oppgaven fra "Oliver-2IM-vurdering" vises under. Åpne i ny fane for full visning.</p>
    </section>

    <section>
      <div class="iframe-wrapper shadow-sm">
        <iframe id="oliverFrame" title="Oliver 2IM vurdering" loading="lazy"></iframe>
      </div>
      <p class="iframe-note mt-3">Hvis rammen ikke laster, forsøk å åpne siden direkte i en ny fane.</p>
      <a id="openExternal" class="btn btn-outline-primary mt-2" href="#" target="_blank" rel="noopener">Åpne i ny fane</a>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
  <script>
    (function () {
      const backBtn = document.getElementById('backBtn');
      if (backBtn) {
        backBtn.addEventListener('click', () => {
          window.location.href = 'index.html';
        });
      }

      const hostedHref = '/Oliver-2IM-vurdering/Index.html';
      const localHref = '../Oliver-2IM-vurdering/Index.html';
      const useHref = window.location.protocol === 'file:' ? localHref : hostedHref;

      const frame = document.getElementById('oliverFrame');
      if (frame) {
        frame.src = useHref;
      }

      const externalLink = document.getElementById('openExternal');
      if (externalLink) {
        externalLink.href = useHref;
      }
    })();
  </script>
</body>
</html>
